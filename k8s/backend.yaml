apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  PORT: "5000"
  NODE_ENV: "development"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "grabfood_mini"
  DB_USER: "root"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CLIENT_URL: "http://localhost:3000"
  JWT_EXPIRES_IN: "1h"
  AI_PROVIDER: "groq"
  GEMINI_MODEL: "gemini-1.5-flash"
  GROQ_MODEL: "llama-3.1-8b-instant"
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  DB_PASSWORD: "password"
  JWT_SECRET: "my_jwt_secret_key"
  JWT_ACCESS_SECRET: "access_secret_123456"
  JWT_REFRESH_SECRET: "refresh_secret_123456"
  MAIL_USER: "your_email@gmail.com"
  MAIL_PASS: "your_mail_app_password"
  GEMINI_API_KEY: "your_gemini_api_key"
  GROQ_API_KEY: "your_groq_api_key"
  PAYOS_CLIENT_ID: "your_payos_client_id"
  PAYOS_API_KEY: "your_payos_api_key"
  PAYOS_CHECKSUM_KEY: "your_payos_checksum_key"
  GOOGLE_CLIENT_ID: "your_google_client_id"
  GOOGLE_CLIENT_SECRET: "your_google_client_secret"
  FACEBOOK_APP_ID: "your_facebook_app_id"
  FACEBOOK_APP_SECRET: "your_facebook_app_secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done;']
      containers:
        - name: backend
          image: grab-backend:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 25
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
  selector:
    app: backend
